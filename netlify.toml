[build]
  publish = "dist"
  command = "npm run build"

# Direct static files serving
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# Canonical domain redirection: tkm.kr -> https://www.tkm.kr
[[redirects]]
  from = "http://tkm.kr/*"
  to = "https://www.tkm.kr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://tkm.kr/*"
  to = "https://www.tkm.kr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.tkm.kr/*"
  to = "https://www.tkm.kr/:splat"
  status = 301
  force = true

# Actor pre-rendered HTML static routing
[[redirects]]
  from = "/artists/choi-eunseo"
  to = "/artists/choi-eunseo/index.html"
  status = 200

[[redirects]]
  from = "/artists/choi-eunseo/"
  to = "/artists/choi-eunseo/index.html"
  status = 200

[[redirects]]
  from = "/artists/lee-eunsoo"
  to = "/artists/lee-eunsoo/index.html"
  status = 200

[[redirects]]
  from = "/artists/lee-eunsoo/"
  to = "/artists/lee-eunsoo/index.html"
  status = 200

[[redirects]]
  from = "/artists/park-minwook"
  to = "/artists/park-minwook/index.html"
  status = 200

[[redirects]]
  from = "/artists/park-minwook/"
  to = "/artists/park-minwook/index.html"
  status = 200

[[redirects]]
  from = "/artists/park-hyunjin"
  to = "/artists/park-hyunjin/index.html"
  status = 200

[[redirects]]
  from = "/artists/park-hyunjin/"
  to = "/artists/park-hyunjin/index.html"
  status = 200

# Main sections pre-rendered HTML routing
[[redirects]]
  from = "/artists"
  to = "/artists/index.html"
  status = 200

[[redirects]]
  from = "/artists/"
  to = "/artists/index.html"
  status = 200

[[redirects]]
  from = "/audition"
  to = "/audition/index.html"
  status = 200

[[redirects]]
  from = "/audition/"
  to = "/audition/index.html"
  status = 200

[[redirects]]
  from = "/news"
  to = "/news/index.html"
  status = 200

[[redirects]]
  from = "/news/"
  to = "/news/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact/index.html"
  status = 200

[[redirects]]
  from = "/contact/"
  to = "/contact/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200

[[redirects]]
  from = "/about/"
  to = "/about/index.html"
  status = 200

# SPA Fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Custom headers
[[headers]]
  for = "/artists/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Custom headers for sitemap and robots
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"
