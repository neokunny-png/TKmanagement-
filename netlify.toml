[build]
  publish = "dist"
  command = "npm run build"

# Direct static files serving
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# Canonical domain redirection: tkm.kr -> https://www.tkm.kr
[[redirects]]
  from = "http://tkm.kr/*"
  to = "https://www.tkm.kr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://tkm.kr/*"
  to = "https://www.tkm.kr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.tkm.kr/*"
  to = "https://www.tkm.kr/:splat"
  status = 301
  force = true

# SPA Fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Custom headers for sitemap and robots
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"
